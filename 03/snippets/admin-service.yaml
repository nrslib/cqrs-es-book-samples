# 削除済み（旧 3.30） 管理操作専用エンドポイントのService定義
# AWS環境での例
# - メインのALB: 一般的なアプリケーションエンドポイント
# - 管理用セキュリティグループ: 特定のIPアドレスからのみ直接アクセス可能

# Kubernetes環境での例
apiVersion: v1
kind: Service
metadata:
  name: axon-app-admin
spec:
  type: NodePort  # または LoadBalancer with specific annotations
  selector:
    app: axon-app
  ports:
  - port: 8081
    targetPort: 8081
    name: admin
